name: Lighthouse CI

on:
  pull_request:
  workflow_dispatch:

# One Lighthouse run per PR at a time to avoid port/resource collisions.
concurrency:
  group: lighthouse-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    name: Lighthouse Mobile Audit
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-anon-key-for-lighthouse"
      SUPABASE_SERVICE_ROLE_KEY: "dummy-service-role-key-for-lighthouse"
      NEXT_PUBLIC_SITE_URL: "https://oltigo.com"
      ROOT_DOMAIN: "oltigo.com"
      SEED_PASSWORDS_ROTATED: "true"
      SEED_USERS_DELETED: "true"
      PHI_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      BACKUP_ENCRYPTION_KEY: "fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210"
      CRON_SECRET: "dummy-cron-secret-0123456789abcdef0123456789abcdef0123456789abcdef"
      BOOKING_TOKEN_SECRET: "dummy-booking-token-secret-0123456789abcdef0123456789abcdef"
      PROFILE_HEADER_HMAC_KEY: "dummy-profile-hmac-key-0123456789abcdef0123456789abcdef"
      R2_SIGNED_URL_SECRET: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      NEXT_PUBLIC_SENTRY_DSN: "https://placeholder@example.ingest.sentry.io/1"
      AV_SCAN_REQUIRED: "false"
      RESEND_API_KEY: "dummy-resend-key-for-lighthouse"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.13"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build production app
        run: npm run build

      - name: Run Lighthouse CI (mobile)
        uses: treosh/lighthouse-ci-action@512cc908a55bfb0ad231facca52adf3d3a651df4 # v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
