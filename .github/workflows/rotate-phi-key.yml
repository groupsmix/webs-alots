name: Rotate PHI Encryption Key

on:
  workflow_dispatch:
    inputs:
      new_key:
        description: "New 64-character hex encryption key"
        required: true
        type: string

# Least-privilege permissions
permissions:
  contents: read

jobs:
  rotate-key:
    runs-on: ubuntu-latest
    name: Rotate PHI Key in R2
    steps:
      # AUDIT-16: Pin GH Actions to SHA for supply-chain hardening
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preflight — verify required secrets are set
        id: preflight
        env:
          PHI_ENCRYPTION_KEY: ${{ secrets.PHI_ENCRYPTION_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          missing=""
          [ -z "$PHI_ENCRYPTION_KEY" ]        && missing="$missing PHI_ENCRYPTION_KEY"
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]  && missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          [ -z "$R2_BUCKET" ]                  && missing="$missing R2_BUCKET"
          if [ -n "$missing" ]; then
            echo "::error::Cannot rotate — missing secrets:$missing"
            echo "::error::Set these in GitHub → Settings → Secrets before triggering this workflow."
            exit 1
          fi
          echo "All required secrets present — proceeding with rotation."

      - name: Run rotation script
        env:
          PHI_ENCRYPTION_KEY: ${{ secrets.PHI_ENCRYPTION_KEY }}
          NEW_PHI_ENCRYPTION_KEY: ${{ inputs.new_key }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          npx tsx scripts/rotate-phi-key.ts
